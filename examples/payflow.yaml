openapi: 3.1.0
info:
  title: Payflow Transfers
  version: 2.0.0
servers:
  - url: https://api.payflow.test/v2
security:
  - BearerAuth: []
paths:
  /transfers:
    post:
      operationId: createTransfer
      tags: [transfers]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [value, ccy, order_id, destination]
              properties:
                value:
                  type: number
                  format: double
                  minimum: 10
                  description: Amount in major currency units
                ccy:
                  type: string
                  enum: [EUR, USD]
                order_id:
                  type: string
                destination:
                  type: object
                  required: [account]
                  properties:
                    account:
                      type: string
                    name:
                      type: string
            example:
              value: 25.5
              ccy: EUR
              order_id: op_abc123
              destination:
                account: "DE89370400440532013000"
                name: Alice
      responses:
        "200":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
              example:
                id: pf_1
                status: queued
        "400":
          description: Invalid
          content:
            application/json:
              example:
                code: bad_request
        "401":
          description: Unauthorized
        "429":
          description: Slow down
  /transfers/{transferId}:
    get:
      operationId: getTransfer
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
              example:
                id: pf_1
                status: ok
  /hooks/transfer:
    post:
      operationId: transferCallback
      parameters:
        - name: X-Payflow-Signature
          in: header
          description: sha256 hex digest
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [transfer.success, transfer.failed]
                transfer_id:
                  type: string
            example:
              type: transfer.success
              transfer_id: pf_1
      responses:
        "204":
          description: OK
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    Transfer:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, ok, error]
